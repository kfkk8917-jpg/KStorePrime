<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Library</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#000;
            color:white;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:space-between;
            align-items:center;
        }

        .container{
            width:100%;
            padding:40px 20px;
            text-align:center;
        }

        h1{
            font-size:50px;
            margin-bottom:50px;
            color:white;
            text-shadow:0 0 20px rgba(255,0,0,0.8);
        }

        .movie-grid{
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .movie-card{
            width:260px;
            background:#111;
            border-radius:20px;
            overflow:hidden;
            text-decoration:none;
            transition:0.35s ease;
            border:1px solid rgba(255,0,0,0.3);
            box-shadow:
                0 0 20px rgba(255,0,0,0.3),
                0 0 40px rgba(255,0,0,0.15);
        }

        .movie-card:hover{
            transform:translateY(-10px) scale(1.03);
            box-shadow:
                0 0 30px rgba(255,0,0,0.6),
                0 0 60px rgba(255,0,0,0.25);
        }

        .movie-poster{
            width:100%;
            height:390px;
            object-fit:cover;
            display:block;
        }

        .movie-title{
            padding:18px;
            font-size:22px;
            font-weight:bold;
            color:white;
        }

        footer{
            margin-top:40px;
            padding:20px;
            color:#888;
            font-size:14px;
        }

        @media(max-width:600px){

            h1{
                font-size:36px;
            }

            .movie-card{
                width:90%;
                max-width:300px;
            }

        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Movie Library</h1>

        <div class="movie-grid">

            <a class="movie-card"
               href="https://archive.org/details/movie_20260511"
               target="_blank">

                <img
                    class="movie-poster"
                    src="https://upload.wikimedia.org/wikipedia/en/7/7d/GOAT_film_poster.jpg"
                    alt="GOAT Movie Poster">

                <div class="movie-title">GOAT</div>

            </a>

        </div>

    </div>

    <footer>
        Powered by Khaled
    </footer>

</body>
</html>
